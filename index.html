<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <title>AI Copywriter Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
        background: #f4f4f9;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        background: #0088cc;
        color: white;
        border: none;
        padding: 10px 15px;
        cursor: pointer;
        border-radius: 4px;
        font-size: 16px;
        width: 100%;
      }
      button:hover {
        background: #006699;
      }
      #result {
        margin-top: 20px;
        background: white;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 4px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h2>🤖 AI Copywriter Generator</h2>

    <div class="form-group">
      <label>Telegram ID:</label>
      <input type="text" id="telegramId" value="123456789" />
    </div>

    <div class="form-group">
      <label>Ism:</label>
      <input type="text" id="name" value="Jasurbek" />
    </div>

    <div class="form-group">
      <label>Kontent turi (Content Type):</label>
      <select id="contentType">
        <option value="Instagram / Telegram Post">Instagram / Telegram Post</option>
        <option value="Mahsulot tavsifi">Mahsulot tavsifi</option>
        <option value="Reklama matni">Reklama matni</option>
      </select>
    </div>

    <div class="form-group">
      <label>Asosiy mavzu / Mahsulot nomi:</label>
      <input type="text" id="promptText" placeholder="Masalan: Qishki kurtkalar chegirmada" />
    </div>

    <div class="form-group">
      <label>Maqsadli auditoriya:</label>
      <input type="text" id="targetAudience" placeholder="Masalan: Yoshlar va tadbirkorlar" />
    </div>

    <div class="form-group">
      <label>Matn tili:</label>
      <select id="language">
        <option value="O'zbekcha (Lotin)">O'zbekcha (Lotin)</option>
        <option value="Русский язык">Русский язык</option>
        <option value="English">English</option>
      </select>
    </div>

    <div class="form-group">
      <label>Ohang / Stil (Tone):</label>
      <select id="tone">
        <option value="Sotuvga yo'naltirilgan (Sales)">Sotuvga yo'naltirilgan (Sales)</option>
        <option value="Rasmiy / Professional">Rasmiy / Professional</option>
        <option value="Yengil / Hazilomuz (SMM style)">Yengil / Hazilomuz (SMM style)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Qo'shimcha talablar (Keywords):</label>
      <input type="text" id="keywords" placeholder="Masalan: Bepul yetkazib berish bor" />
    </div>

    <button onclick="generateContent()">Matn yaratish 🚀</button>

    <h3>Natija:</h3>
    <div id="result">Hozircha natija yo'q...</div>

    <script>
      async function generateContent() {
        const data = {
          telegramId: document.getElementById("telegramId").value,
          name: document.getElementById("name").value,
          contentType: document.getElementById("contentType").value,
          promptText: document.getElementById("promptText").value,
          targetAudience: document.getElementById("targetAudience").value,
          language: document.getElementById("language").value,
          tone: document.getElementById("tone").value,
          keywords: document.getElementById("keywords").value,
        };

        const resultDiv = document.getElementById("result");
        resultDiv.innerText = "Matn yaratilmoqda, iltimos kuting...";

        try {
          const response = await fetch("http://localhost:5000/api/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });

          const result = await response.json();
          if (response.ok) {
            // result.generatedText o'rniga result.data.generatedText yozamiz
            resultDiv.innerText = result.data.generatedText;
          } else {
            resultDiv.innerText = "Xatolik: " + (result.error || "Noma'lum xato");
          }
        } catch (error) {
          resultDiv.innerText = "Serverga ulanishda xatolik yuz berdi: " + error.message;
        }
      }
    </script>
  </body>
</html>
